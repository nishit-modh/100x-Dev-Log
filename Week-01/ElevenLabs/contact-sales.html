<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Sales</title>
    <link rel="stylesheet" href="contact-sales.css" />
    <link rel="shortcut icon" href="./Assets/fav-icon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <div id="main-flex-container">
      <!-- lef div -->
      <div id="left-div">
        <!-- left div content -->
        <div id="left-div-flex">
          <!-- image logo link -->
          <a href="missing.html" id="elevenLabs-img-flex">
            <img
              src="./Assets/elevenLabsWhite.svg"
              alt="ElevenLabs"
              width="128px"
            />
            <div></div>
          </a>
          <!-- contact heading -->
          <h1 id="contact-team-title">Contact our sales team</h1>
          <div id="marketing-div-flex">
            <div class="marketing-lines">
              <img src="./Assets/rocket.svg" alt="rocket" />
              <p>Custom pricing and elevated concurrency</p>
            </div>
            <div class="marketing-lines">
              <img src="./Assets/shield.svg" alt="shield" />
              <p>
                Enterprise-grade security including SOC II, GDPR and HIPAA
                compliance
              </p>
            </div>
            <div class="marketing-lines">
              <img src="./Assets/enterprise.svg" alt="enterprise" />
              <p>Enterprise support and SLAs</p>
            </div>
          </div>
          <!-- faded text and partner logos -->
          <div id="partners-div-flex">
            <div id="trusted-partners">
              <p>Trusted by 10,000+ leading businesses</p>
              <div id="partner-window">
                <div id="partner-train">
                  <div>
                    <img src="./Assets/cisco.svg" alt="" />
                  </div>
                  <div>
                    <img src="./Assets/DeutscheT.svg" alt="" id="DT" />
                  </div>
                  <div>
                    <img src="./Assets/disney.svg" class="invert" id="disney" />
                  </div>
                  <div>
                    <img src="./Assets/nvidia.svg" alt="" id="nvidia" />
                  </div>
                  <div>
                    <img src="./Assets/SF.svg" class="invert" id="sfLogo" />
                  </div>
                </div>
              </div>
            </div>
            <div id="reviews">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <p>4.5 stars and 1,059+ reviews</p>
            </div>
          </div>
        </div>
        <!-- left div images -->
        <div id="platform-images">
          <div id="agents-platform-img" class="active">
            <img
              src="./Assets/agents-platform.webp"
              alt="agents-platform"
              width="620px"
            />
          </div>
          <div id="creative-platform-img">
            <img
              src="./Assets/creative-platform.webp"
              alt="creative-platform"
              width="620px"
            />
          </div>
        </div>
      </div>
      <!-- right div -->
      <div id="right-div">
        <div id="right-div-flex">
          <div id="form-head">
            <h1>Contact sales form</h1>
            <p>Please fill out the form below to get started</p>
          </div>
          <div>
            <form action="#" id="sales-form">
              <label for="sales-website">Company Website </label>
              <input type="text" name="" id="sales-website" placeholder="elevenlabs.io" />
              <label for="sales-mail">Business Email </label>
              <input type="email" name="" id="sales-mail" placeholder="example@elevenlabs.io"/>
            </form>
          </div>
          <div id="progress-bar">
            <button id="next-btn">Next</button>
          </div>
        </div>
      </div>
    </div>
    <script src="contact-sales.js"></script>
  </body>
</html>
